<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users — Asterisk Management Appliance</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h2>Asterisk<br>Appliance</h2>
        <p>Management Dashboard</p>
      </div>
      <ul class="sidebar-nav">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="extensions.html">Extensions</a></li>
        <li><a href="users.html" class="active">Users</a></li>
        <li><a href="dialplan.html">Dialplan</a></li>
        <li><a href="voicemail.html">Voicemail</a></li>
        <li><a href="queues.html">Queues</a></li>
        <li><a href="ivr.html">IVR</a></li>
        <li><a href="cdr.html">CDR</a></li>
      </ul>
      <div class="sidebar-footer">
        <span data-user></span><br>
        <span data-user-role></span>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <h1>Users</h1>
        </div>
        <div class="topbar-right">
          <span class="user-badge"><span data-user></span> <span data-user-role></span></span>
          <button class="nb-btn ghost small" id="open-add-user">Add User</button>
          <button class="nb-btn ghost small" data-logout>Logout</button>
        </div>
      </header>

      <h2 class="page-title">User Management</h2>
      <p style="color:var(--nb-darkgray); font-size:0.9rem; text-transform:uppercase; letter-spacing:0.5px;">
        Admin / operator accounts for the web appliance. Admin-only.
      </p>

      <div id="user-alert" class="alert error" style="display:none;"></div>

      <div class="form-card nb-card" style="padding:1.5rem; max-width:560px; margin-bottom:2rem;">
        <h3 style="margin-top:0; text-transform:uppercase; font-size:1rem;">Add / Edit User</h3>
        <form id="user-form" novalidate>
          <input type="hidden" id="user-id">
          <div class="form-row">
            <div class="nb-form-group">
              <label class="nb-label">Username</label>
              <input class="nb-input" id="user-username" name="username" placeholder="jdoe" required>
            </div>
            <div class="nb-form-group">
              <label class="nb-label">Email</label>
              <input class="nb-input" id="user-email" name="email" type="email" placeholder="jdoe@example.com" required>
            </div>
          </div>
          <div class="form-row">
            <div class="nb-form-group">
              <label class="nb-label">Password</label>
              <input class="nb-input" id="user-password" name="password" type="password" placeholder="••••••••" required>
            </div>
            <div class="nb-form-group">
              <label class="nb-label">Role</label>
              <select class="nb-input" id="user-role" name="role">
                <option value="operator">Operator</option>
                <option value="admin">Admin</option>
              </select>
            </div>
          </div>
          <div style="display:flex; gap:1rem; margin-top:1rem;">
            <button type="submit" class="nb-btn primary">Save User</button>
            <button type="button" class="nb-btn ghost" id="user-cancel">Cancel</button>
          </div>
        </form>
      </div>

      <div class="section">
        <div class="section-title">
          <span>All Users</span>
          <span class="nb-badge" id="user-count">0</span>
        </div>
        <div class="nb-card" style="overflow:auto;">
          <table class="nb-table">
            <thead>
              <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Role</th>
                <th>Active</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="user-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
  <script type="module">
    import { api, get, post, put, del } from "./js/api.js";

    const form = document.getElementById("user-form");
    const alertEl = document.getElementById("user-alert");
    const tbody = document.getElementById("user-table-body");
    const countEl = document.getElementById("user-count");
    const openAdd = document.getElementById("open-add-user");
    const cancelBtn = document.getElementById("user-cancel");
    let editingId = null;

    async function load() {
      const data = await get("/users");
      tbody.innerHTML = "";
      countEl.textContent = data.length;
      data.forEach((u) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${u.username}</strong></td>
          <td>${u.email}</td>
          <td><span class="nb-badge ${u.role === 'admin' ? 'danger' : 'info'}">${u.role}</span></td>
          <td>${u.is_active ? '<span class="nb-badge success small">active</span>' : '<span class="nb-badge dark small">off</span>'}</td>
          <td class="actions">
            <button class="nb-btn small" onclick="app.editUser(${u.id})">Edit</button>
            ${u.id == 1 ? '<span class="nb-btn small" style="opacity:0.5;cursor:default;">—</span>' : `<button class="nb-btn small danger" onclick="app.deleteUser(${u.id}, '${u.username}')">Delete</button>`}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function showAlert(msg) {
      alertEl.textContent = msg;
      alertEl.style.display = "block";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        username: form.user_username.value,
        email: form.user_email.value,
        password: form.user_password.value,
        role: form.user_role.value,
      };
      try {
        if (editingId) {
          await put(`/users/${editingId}`, payload);
        } else {
          await post("/users", payload);
        }
        form.reset();
        editingId = null;
        document.getElementById("user-id").value = "";
        cancelBtn.style.display = "none";
        await load();
      } catch (err) {
        showAlert(err.message || "Failed to save user");
      }
    });

    cancelBtn.addEventListener("click", () => {
      form.reset();
      editingId = null;
      document.getElementById("user-id").value = "";
      cancelBtn.style.display = "none";
    });

    openAdd.addEventListener("click", () => {
      form.reset();
      editingId = null;
      document.getElementById("user-id").value = "";
      cancelBtn.style.display = "none";
    });

    window.app = {
      editUser: async (id) => {
        const data = await get("/users");
        const u = data.find((x) => x.id === id);
        if (!u) return;
        document.getElementById("user-id").value = u.id;
        form.user_username.value = u.username;
        form.user_email.value = u.email;
        form.user_password.value = "";
        form.user_role.value = u.role;
        editingId = u.id;
        cancelBtn.style.display = "inline-block";
      },
      deleteUser: async (id, username) => {
        if (!confirm(`Delete user ${username}?`)) return;
        await del(`/users/${id}`);
        await load();
      },
    };

    load();
  </script>
</body>
</html>

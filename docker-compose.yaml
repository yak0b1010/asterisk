name: asterisk-appliance

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-asterisk}
      POSTGRES_USER: ${DB_USER:-asterisk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-asterisk_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-asterisk} -d ${DB_NAME:-asterisk}"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-asterisk}
      DB_USER: ${DB_USER:-asterisk}
      DB_PASSWORD: ${DB_PASSWORD:-asterisk_pass}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-secret-key}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80}
      FLASK_ENV: production
    ports:
      - "${BACKEND_HOST_PORT:-5000}:5000"

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"

volumes:
  pgdata:

; Included at the bottom of base/modules.conf.
; (+) appends to the existing category rather than replacing the base policy.
[modules](+)
; Declare mandatory dependencies, but verify actual module state as well:
; the tested pinned image stayed running after a required module failed.
; These declarations do not install modules absent from the pinned image.

; PostgreSQL connection, realtime storage driver, and PJSIP object lookup.
require = res_odbc.so
require = res_config_odbc.so
require = res_sorcery_realtime.so

; SIP signalling, registration, and digest authentication.
require = res_pjsip.so
require = res_pjsip_registrar.so
require = res_pjsip_authenticator_digest.so
require = chan_pjsip.so

; Static base contexts plus DB-backed dialplan steps.
require = pbx_config.so
require = pbx_realtime.so

; Mailboxes, call queues, conferences, and IVR digit collection/branching.
require = app_voicemail.so
require = app_queue.so
require = app_confbridge.so
require = app_read.so
require = func_dialplan.so

; CDR output is separate from realtime configuration lookups.
require = cdr_adaptive_odbc.so

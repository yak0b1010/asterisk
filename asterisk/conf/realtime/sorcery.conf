; Realtime mode: route PJSIP objects through the realtime wizard.
; Syntax: object-type = wizard,realtime-family (mapped in extconfig.conf).
; Transports/global options keep the static pjsip.conf source.
[res_pjsip]
endpoint     = realtime,ps_endpoints
auth         = realtime,ps_auths
aor          = realtime,ps_aors
domain_alias = realtime,ps_domain_aliases
; Unlike provisioning, contact rows are written by Asterisk on registration.
contact      = realtime,ps_contacts
; Cache
endpoint/cache = memory_cache,object_lifetime_stale=30,expire_on_reload=yes
aor/cache = memory_cache,object_lifetime_stale=30,expire_on_reload=yes
auth/cache = memory_cache,object_lifetime_stale=30,expire_on_reload=yes

[res_pjsip_endpoint_identifier_ip]
identify = realtime,ps_endpoint_id_ips

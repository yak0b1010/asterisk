; Shared profile defaults only; DB dialplan rows choose the room and may set
; per-room options through CONFBRIDGE() before invoking ConfBridge().
[general]

[default_bridge]
type = bridge
max_members = 20

[default_user]
type = user
music_on_hold_when_empty = yes
music_on_hold_class = default
; Per-conference PINs/options are set with CONFBRIDGE() in DB dialplan steps.

; ============================================================================
; Realtime-mode dialplan extras.
;
; base/extensions.conf is always baked into the image and provides the test
; numbers in [internal]:
;   000 echo
;   001 hello-world playback
;   002 DTMF readback
;   003 record-and-playback
;   004 music-on-hold test
; Those are kept unchanged in realtime mode.
;
; Dynamic endpoints/auths/aors live in PostgreSQL (see extconfig.conf +
; sorcery.conf). Any other dialed extension is routed to its PJSIP endpoint,
; so database-created users are reachable without editing config files.
; ============================================================================

[internal]

; Route dynamic (DB-backed) extensions to their PJSIP endpoint.
; Exact matches from base/extensions.conf (000-004) take priority.
exten => _X.,1,NoOp(Realtime dial to PJSIP/${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

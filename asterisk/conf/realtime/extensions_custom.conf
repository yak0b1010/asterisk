; Static test numbers 000–004 come from base/extensions.conf and win first.
; No static _X. catch-all: all other behavior is native DB dialplan steps.
; pbx_realtime supports numeric priorities, not labels or hints.
[internal]
switch => Realtime/@

[handle-admin]
switch => Realtime/@

[handle-finance]
switch => Realtime/@

[handle-it]
switch => Realtime/@

[handle-support]
switch => Realtime/@

[handle-management]
switch => Realtime/@

; IVRs share this fixed context, with unique extension names for each menu.
; Read() collects a digit; DB steps branch to menu-specific destinations.
; No per-menu static contexts or dynamically selected switch contexts:
; pbx_realtime's match cache is keyed by the calling context/exten/priority,
; so multiplexing different DB contexts through one eswitch could mix menus.
[realtime-ivr]
switch => Realtime/@

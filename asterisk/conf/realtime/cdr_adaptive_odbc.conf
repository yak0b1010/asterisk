; Writes call records through the same ODBC class used for realtime lookups.
; The alias supplies actual call-start time to the schema's calldate column.
[asterisk]
connection = asterisk
table = cdr
alias start => calldate
; PostgreSQL reserves END. Quote native column identifiers in generated INSERTs.
quoted_identifiers = "
; Store UTC wall-clock timestamps; reporting must interpret these as UTC.
usegmtime = yes

; Syntax: family => driver,connection-class[,table].
; "asterisk" is the res_odbc.conf class, not the DSN name; its DSN is
; "asterisk-pgsql". With no explicit table, the family name is the table name.
[settings]
; PJSIP provisioning and Asterisk-managed registration contacts.
ps_endpoints       => odbc,asterisk
ps_auths           => odbc,asterisk
ps_aors            => odbc,asterisk
ps_domain_aliases  => odbc,asterisk
ps_endpoint_id_ips => odbc,asterisk
ps_contacts        => odbc,asterisk
; Other realtime consumers. CDR uses cdr_adaptive_odbc.conf, not this mapping.
voicemail          => odbc,asterisk
extensions         => odbc,asterisk
queues             => odbc,asterisk
queue_members      => odbc,asterisk

[global]
type = global
user_agent = Asterisk PBX

; --- Transports -----------------------------------------------------------
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; WSS rides on the TLS-enabled HTTP server from http.conf
[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0:8089

; --- Endpoints ------------------------------------------------------------
; Generated by the backend from the database into /etc/asterisk/generated/.
; The backend writes the file before Asterisk starts (see docker-compose.yaml).
#tryinclude generated/pjsip_endpoints.conf

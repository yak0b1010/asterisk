[global]
type = global
user_agent = Asterisk PBX

; --- Transports -----------------------------------------------------------
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

; WSS rides on the TLS-enabled HTTP server from http.conf
[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0:8089

; --- Endpoints ------------------------------------------------------------
; Static in standalone, PostgreSQL-backed in realtime.
#include pjsip_endpoints.conf

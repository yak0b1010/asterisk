; ============================================================================
; Base dialplan
; Department/service dialplan lives in standalone/extensions_custom.conf.
; ============================================================================

[general]
static = yes
writeprotect = no

[internal]

; ---------------------------------------------------------------------------
; 000 - Echo test
; Verifies that SIP signalling and the RTP media path work.
; ---------------------------------------------------------------------------
exten => 000,1,Answer()
 same => n,Echo()

; ---------------------------------------------------------------------------
; 001 - Hello World playback
; ---------------------------------------------------------------------------
exten => 001,1,Answer()
 same => n,Playback(hello-world)
 same => n,Wait(2)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; 002 - DTMF test
; Reads up to four digits, then reads them back.
; ---------------------------------------------------------------------------
exten => 002,1,Answer()
 same => n,Playback(beep)
 same => n,Read(DTMF,,4)
 same => n,GotoIf($["${DTMF}" = ""]?done)
 same => n,SayDigits(${DTMF})
 same => n(done),Hangup()

; ---------------------------------------------------------------------------
; 003 - Record and playback test
; Records up to 30 seconds after the beep, then plays it back.
; ---------------------------------------------------------------------------
exten => 003,1,Answer()
 same => n,Set(REC=rec-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)})
 same => n,Record(/var/spool/asterisk/record/${REC}:wav,3,30)
 same => n,Playback(/var/spool/asterisk/record/${REC})
 same => n,Hangup()

; ---------------------------------------------------------------------------
; 004 - Music on hold test
; ---------------------------------------------------------------------------
exten => 004,1,Answer()
 same => n,MusicOnHold(default)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; Mode-specific additions: standalone services, departments, handlers.
; Any additional configurations beside the base must be in extentions_custom.conf
; ---------------------------------------------------------------------------
#include extensions_custom.conf
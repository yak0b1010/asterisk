[general]
static = yes
writeprotect = no

[internal]
; Softphones
exten => 1001,1,Dial(PJSIP/1001,20)
 same => n,Hangup()
exten => 1002,1,Dial(PJSIP/1002,20)
 same => n,Hangup()

; Echo test - verifies the media path
exten => 999,1,Answer()
 same => n,Echo()

; Playback + recording test - verifies sounds and gives you a file to listen to
exten => 600,1,Answer()
 same => n,MixMonitor(hello-${UNIQUEID}.wav)
 same => n,Playback(hello-world)
 same => n,Wait(2)
 same => n,Hangup()

; Mode-specific extras
#include extensions_custom.conf

[general]
enabled    = yes
bindaddr   = 0.0.0.0
bindport   = 8088
servername = Asterisk

; TLS termination: WSS for the Flutter softphone (:8089) and ARI over HTTPS.
; The certificate is generated on first start into /var/lib/asterisk/keys.
tlsenable   = yes
tlsbindaddr = 0.0.0.0:8089
tlscertfile = /var/lib/asterisk/keys/asterisk.pem

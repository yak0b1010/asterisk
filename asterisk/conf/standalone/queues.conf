; ============================================================================
; Static queues - standalone mode
; global settings and department call-center queues.
;
; Department queues contain every extension in their range.
; rrmemory rings one agent at a time, which is required for 100-member queues.
; Queue() in extensions_custom.conf supplies the 300-second caller timeout.
; ============================================================================

[general]
persistentmembers = yes
autofill = yes
monitor-type = MixMonitor


; ============================================================================
; Queue configuration - managed by the backend.
;
; The real file is generated from the database into:
;   /etc/asterisk/generated/queues.conf
;
; That directory is mounted from ./asterisk/generated by docker-compose.yaml.
; `#tryinclude` lets Asterisk start even when the backend has not generated
; the file yet (for example when running the PBX container alone).
; ============================================================================

#tryinclude generated/queues.conf

; ============================================================================
; Logging - standalone mode
; queue_log is enabled so queue statistics can be read from
; /var/log/asterisk/queue_log in standalone mode.
; ============================================================================

[general]
dateformat = %F %T
use_callids = yes
queue_log = yes
queue_log_to_file = yes
queue_log_name = queue_log

[logfiles]
console  => notice,warning,error,verbose
messages => notice,warning,error
full     => notice,warning,error,debug,verbose
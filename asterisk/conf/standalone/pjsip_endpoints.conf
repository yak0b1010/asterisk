; ============================================================================
; Static PJSIP endpoints - standalone mode
; 500 extensions: 100-599
; Each extension has its own auth object and AOR.
; Password format: <extension>pass
; ============================================================================

; ---------------------------------------------------------------------------
; Shared templates
; ---------------------------------------------------------------------------
[dept-endpoint](!)
type=endpoint
context=internal
disallow=all
allow=ulaw,alaw,opus,g722
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

[dept-auth](!)
type=auth
auth_type=userpass

[dept-aor](!)
type=aor
max_contacts=2
remove_existing=yes


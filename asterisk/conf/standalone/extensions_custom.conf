; ============================================================================
; Standalone dialplan
;
; This file is included at the end of [internal] in base/extensions.conf.
; The [internal] header is repeated here so the file is also valid standalone.
;
; Service numbers:
;   010  Administration call-center queue -> overflow to 010@departments
;   011  Finance call-center queue -> overflow to 011@departments
;   012  IT call-center queue -> overflow to 012@departments
;   013  Customer Service call-center queue -> overflow to 013@departments
;   014  Management call-center queue -> overflow to 014@departments
;   020  Voicemail main (prompted)
;   021  Voicemail deposit into caller's own mailbox
;
; Department calls:
;   100-199  Administration -> person-first, personal voicemail busy/no-answer
;   200-299  Finance        -> person-first, personal voicemail busy/no-answer
;   300-399  IT             -> person-first, personal voicemail busy/no-answer
;   400-499  Customer Service -> q-support queue (exception), overflow to CS mailbox
;   500-599  Management     -> person-first, personal voicemail busy/no-answer
; ============================================================================

[internal]

; ---------------------------------------------------------------------------
; Direct call-center queue numbers
; Queue overflow falls through to the shared department mailbox.
; ---------------------------------------------------------------------------
exten => 010,1,NoOp(Administration call-center queue)
 same => n,Queue(q-admin,,,,300)
 same => n,GotoIf($["${QUEUESTATUS}" = "TIMEOUT"]?vm)
 same => n,GotoIf($["${QUEUESTATUS}" = "FULL"]?vm)
 same => n,GotoIf($["${QUEUESTATUS}" = "JOINEMPTY"]?vm)
 same => n,Hangup()
 same => n(vm),VoiceMail(010@departments,u)
 same => n,Hangup()

exten => 011,1,NoOp(Finance call-center queue)
 same => n,Queue(q-finance,,,,300)
 same => n,GotoIf($["${QUEUESTATUS}" = "TIMEOUT"]?vm)
 same => n,GotoIf($["${QUEUESTATUS}" = "FULL"]?vm)
 same => n,GotoIf($["${QUEUESTATUS}" = "JOINEMPTY"]?vm)
 same => n,Hangup()
 same => n(vm),VoiceMail(011@departments,u)
 same => n,Hangup()

exten => 012,1,NoOp(IT call-center queue)
 same => n,Queue(q-it,,,,300)
 same => n,GotoIf($["${QUEUESTATUS}" = "TIMEOUT"]?vm)
 same => n,GotoIf($["${QUEUESTATUS}" = "FULL"]?vm)
 same => n,GotoIf($["${QUEUESTATUS}" = "JOINEMPTY"]?vm)
 same => n,Hangup()
 same => n(vm),VoiceMail(012@departments,u)
 same => n,Hangup()

exten => 013,1,NoOp(Customer Service call-center queue)
 same => n,Queue(q-support,,,,300)
 same => n,GotoIf($["${QUEUESTATUS}" = "TIMEOUT"]?vm)
 same => n,GotoIf($["${QUEUESTATUS}" = "FULL"]?vm)
 same => n,GotoIf($["${QUEUESTATUS}" = "JOINEMPTY"]?vm)
 same => n,Hangup()
 same => n(vm),VoiceMail(013@departments,u)
 same => n,Hangup()

exten => 014,1,NoOp(Management call-center queue)
 same => n,Queue(q-management,,,,300)
 same => n,GotoIf($["${QUEUESTATUS}" = "TIMEOUT"]?vm)
 same => n,GotoIf($["${QUEUESTATUS}" = "FULL"]?vm)
 same => n,GotoIf($["${QUEUESTATUS}" = "JOINEMPTY"]?vm)
 same => n,Hangup()
 same => n(vm),VoiceMail(014@departments,u)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; Voicemail service numbers
; 020 prompts the caller for a mailbox (works for personal and department).
; 021 deposits a message into the caller's own mailbox.
; ---------------------------------------------------------------------------
exten => 020,1,NoOp(Voicemail main)
 same => n,Answer()
 same => n,VoiceMailMain()
 same => n,Hangup()

exten => 021,1,NoOp(Voicemail deposit)
 same => n,Answer()
 same => n,VoiceMail(${CALLERID(num)}@default,u)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; Per-number overrides
;
; Add exact extensions here before the department patterns. An exact match
; always wins over _1XX/_2XX/_3XX/_4XX/_5XX.
;
; Example:
; exten => 100,1,NoOp(Custom handling for 100)
;  same => n,Dial(PJSIP/100,20)
;  same => n,Hangup()
; ---------------------------------------------------------------------------

; ---------------------------------------------------------------------------
; Department routing
; ---------------------------------------------------------------------------
exten => _1XX,1,Goto(handle-admin,${EXTEN},1)
exten => _2XX,1,Goto(handle-finance,${EXTEN},1)
exten => _3XX,1,Goto(handle-it,${EXTEN},1)
exten => _4XX,1,Goto(handle-support,${EXTEN},1)
exten => _5XX,1,Goto(handle-management,${EXTEN},1)

; ============================================================================
; Administration handler - person-first
; Busy -> voicemail with busy greeting
; No answer / unavailable -> voicemail with unavailable greeting
; ============================================================================
[handle-admin]
exten => _1XX,1,NoOp(Administration call from ${CALLERID(num)} to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,Goto(unavail)
 same => n(busy),VoiceMail(${EXTEN}@default,b)
 same => n,Hangup()
 same => n(unavail),VoiceMail(${EXTEN}@default,u)
 same => n,Hangup()
 same => n(done),Hangup()

; ============================================================================
; Finance handler - person-first
; Busy -> voicemail with busy greeting
; No answer / unavailable -> voicemail with unavailable greeting
; ============================================================================
[handle-finance]
exten => _2XX,1,NoOp(Finance call from ${CALLERID(num)} to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,Goto(unavail)
 same => n(busy),VoiceMail(${EXTEN}@default,b)
 same => n,Hangup()
 same => n(unavail),VoiceMail(${EXTEN}@default,u)
 same => n,Hangup()
 same => n(done),Hangup()

; ============================================================================
; IT handler - person-first
; Busy -> voicemail with busy greeting
; No answer / unavailable -> voicemail with unavailable greeting
; ============================================================================
[handle-it]
exten => _3XX,1,NoOp(IT call from ${CALLERID(num)} to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,Goto(unavail)
 same => n(busy),VoiceMail(${EXTEN}@default,b)
 same => n,Hangup()
 same => n(unavail),VoiceMail(${EXTEN}@default,u)
 same => n,Hangup()
 same => n(done),Hangup()

; ============================================================================
; Customer Service handler - queue exception
; Calling 400-499 enters q-support (same as dialing 013).
; Queue overflow -> CS department mailbox (013@departments).
; ============================================================================
[handle-support]
exten => _4XX,1,NoOp(Customer Service call from ${CALLERID(num)} to ${EXTEN} -> q-support)
 same => n,Queue(q-support,,,,300)
 same => n,GotoIf($["${QUEUESTATUS}" = "TIMEOUT"]?vm)
 same => n,GotoIf($["${QUEUESTATUS}" = "FULL"]?vm)
 same => n,GotoIf($["${QUEUESTATUS}" = "JOINEMPTY"]?vm)
 same => n,Hangup()
 same => n(vm),VoiceMail(013@departments,u)
 same => n,Hangup()

; ============================================================================
; Management handler - person-first
; Busy and no-answer both go to personal voicemail.
; ============================================================================
[handle-management]
exten => _5XX,1,NoOp(Management call from ${CALLERID(num)} to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,Goto(unavail)
 same => n(busy),VoiceMail(${EXTEN}@default,b)
 same => n,Hangup()
 same => n(unavail),VoiceMail(${EXTEN}@default,u)
 same => n,Hangup()
 same => n(done),Hangup()
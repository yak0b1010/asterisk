; ============================================================================
; Static voicemail - standalone mode
; One mailbox per extension, 100-599.
; PIN = 0<extension> (for example 100 -> 0100, 599 -> 0599)
; ============================================================================

[general]
format = wav49|gsm|wav
maxmsg = 100
maxsecs = 180
minsecs = 3
maxgreet = 60
skipms = 3000
maxsilence = 10
silencethreshold = 128
maxlogins = 3

